- name: installing nginx
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install nginx
    ansible.builtin.package:
      name: nginx
      state: present
      msg: "installing nginx server"

  - name: start the nginx
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes
      msg: "start the nginx server"
