- name: creating a variable file with the help of prompt
  hosts: local
  connection: local
  vars_prompt:
    - name: username
      prompt: "what is you name"
      private: false
  
    - name: password
      prompt: "enter you password"
      private: true

  tasks:
  - name: create a variable with prompt file
    ansible.builtin.debug:
      msg:  "your credentials are evaluated and you name is {{ "username" }}"
    
