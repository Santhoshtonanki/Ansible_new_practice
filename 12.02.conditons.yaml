- name: conditions in ansible
  hosts: local
  connection: local
  become: yes

  tasks:
  - name: check the given number is less than  20
    ansible.builtin.debug:
      msg: the given number {{ number }} is less than 20
    when: number | int < 20
  - name: check the given number is greater than  20
    ansible.builtin.debug:
      msg: the given number {{ number }} is greater than 20
    when: number | int > 20
  - name: check the given number is equal to  20
    ansible.builtin.debug:
      msg: the given number {{ number }} is equal to 20
    when: number | int == 20

#One more important point: The value passed through -e "number=13" may be treated as a string. Therefore, it is recommended to use number | int to convert the value into an integer before performing numerical comparisons.

#or else you can also mention number value in the vars section of the playbook
