- name: conditions in ansible
  hosts: local
  connection: local
  become: yes

  tasks:
  - name: check the given number is less than  20
    ansible.builtin.debug:
      msg: the given number {{ number }} is less than 20
    when: number | int < 20
  - name: check the given number is greater than  20
    ansible.builtin.debug:
      msg: the given number {{ number }} is greater than 20
    when: number | int > 20
  - name: check the given number is equal to  20
    ansible.builtin.debug:
      msg: the given number {{ number }} is equal to 20
    when: number | int == 20
