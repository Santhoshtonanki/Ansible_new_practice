- name: defining data types
  hosts: local
  connection: local
  vars:
    Tool: Ansible #string
    Duration: "7 Hours" #string
    Platform: "Join DevOps" #string
    Learner: "Mr. Paint" #string
    is-live: true #boolean
    
    #list
    Topics: # ["Jenkins", "Kubernetes", "Docker", "Ansible"]
      - Jenkins
      - Kubernetes
      - Docker
      - Ansible 
    
    Concepts:
      Cloud: aws
      Infrastructure: Terraform

  tasks:
  - name: creating data types files
    ansible.builtin.debug:
      msg: 
        - "Tool name is {{ Tool }}" 
        - "Duration is {{ Duration }}"
        - "Platform is {{ Platform }}" 
        - "Learner is {{ Learner }}"
        - "Topics are {{ Topics }}" 
        - "concepts are {{ Concepts }}"

