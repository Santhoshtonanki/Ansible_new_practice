- name: checking the credentials by using prompt
  hosts: local
  connections: local
  become: yes

  vars_prompt:
  - name: collecting the user name
    prompt: please enter your user name
    private: false

  - name: collecting the password
    prompt: please enter your user password
    private: true

  tasks:
  - name: verifying the user login credentials
    ansible.builtin.debug:
      msg: "your credential are verified successfully and now you can start your work"
    when: user name == "admin" and password == "123"

  - name: credentials are miss matched
    ansible.builtin.debug:
      msg: "your credentials are miss matched and please try again"
    when: user name != "admin" and password != "123"
