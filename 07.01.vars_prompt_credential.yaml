- name: checking the credentials by using prompt
  hosts: local
  connection: local
  become: yes

  vars_prompt:
  - name: username
    prompt: please enter your username
    private: false

  - name: password
    prompt: please enter your password
    private: true

  tasks:
  - name: verifying the user login credentials
    ansible.builtin.debug:
      msg: "your credential are verified successfully and now you can start your work"
    when: username == "admin" and password == "123"

  - name: credentials are miss matched
    ansible.builtin.debug:
      msg: "your credentials are miss matched and please try again"
    when: username != "admin" or password != "123"
