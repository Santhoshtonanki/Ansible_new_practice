- name: testing the variable preference
  hosts: local
  connection: local
  become: yes

  vars_files:
  - personal_information.yaml

  vars:
    name: play level variable robin
    age: 30
    location: Hyderabad
    designation: Cloud Engineer
    employer: accenture

  vars_prompt:
  - name: prompt level variable robin
    prompt: please enter your name
    private: false

  tasks:
  - name: getting variable information form inventory file
    vars:
    - name: task level variable robin
      age: 30
      location: Hyderabad
      designation: Cloud Engineer
      employer: accenture

    ansible.builtin.debug:
      msg: my name is {{ name }}, my age is {{ age }}, my location is {{ location }}, i am working as a {{ designation }} in {{ employer }} office
